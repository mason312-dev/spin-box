<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Critical first-paint styles: available before JS, fonts and app CSS. -->
    <style>
      html,body{margin:0;background:#1b1918;color:#f1eee7;color-scheme:dark}
      .tsb-page-loader{box-sizing:border-box;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#1b1918;color:#f1eee7;font-family:Arial,Helvetica,sans-serif}
      .tsb-page-loader>img{display:block;width:64px;height:64px;margin-bottom:18px}
      .tsb-loader-brand{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-1px}
      .tsb-loader-brand>span{color:#ff7057}
      .tsb-loader-progress{box-sizing:border-box;width:22px;height:22px;margin-top:28px;border:2px solid #53453c;border-top-color:#ff7057;border-radius:50%;animation:tsb-loader-turn .8s linear infinite}
      .tsb-loader-caption{margin:14px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#beb5ae}
      @keyframes tsb-loader-turn{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.tsb-loader-progress{animation:none}}
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1918" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TemuSpinBox" />

    <title>TemuSpinBox | Pick an item. Spin for a chance to win.</title>
    <meta name="description" content="Choose a Temu product, understand the stake and discover the three possible outcomes. Independent platform. 18+; paid participation involves risk." />

    <!-- OpenGraph / Referral Link Social Previews (Telegram, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://temuspinbox.com/" />
    <meta property="og:title" content="TemuSpinBox | Pick an item. Spin for a chance to win." />
    <meta property="og:description" content="Bring your wishlist. Learn how product spins, delivery and wallet alternatives work. 18+; no guaranteed wins." />
    <meta property="og:image" content="https://temuspinbox.com/favicon.svg" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root">
      <div class="tsb-page-loader" role="status" aria-label="Loading TemuSpinBox">
        <img src="/reveal-fold.svg" width="64" height="64" alt="" />
        <p class="tsb-loader-brand">Temu<span>Spin</span>Box</p>
        <div class="tsb-loader-progress" aria-hidden="true"></div>
        <p class="tsb-loader-caption">Getting things ready…</p>
      </div>
    </div>
    <noscript><p style="text-align:center;padding:20px;font-family:Arial,sans-serif">Please enable JavaScript to use TemuSpinBox.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
